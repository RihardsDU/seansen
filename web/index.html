<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seansen – påkall riktig konsulent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="embers" aria-hidden="true"></canvas>
<div class="tåke" aria-hidden="true"><i></i><i></i><i></i></div>
<div id="øyne" aria-hidden="true"></div>
<div id="lyn" class="lyn" aria-hidden="true"></div>
<div id="skrekk" class="skrekk" hidden aria-hidden="true">
  <svg class="ansikt" viewBox="0 0 200 240">
    <defs>
      <radialGradient id="hud" cx="50%" cy="38%"><stop offset="0" stop-color="#efe8d8"/><stop offset=".7" stop-color="#a39a8b"/><stop offset="1" stop-color="#4a4139"/></radialGradient>
      <filter id="glød"><feGaussianBlur stdDeviation="2.5"/></filter>
    </defs>
    <path d="M100 8c-54 0-84 37-84 88 0 31 14 55 32 69v39c0 10 8 18 18 18h68c10 0 18-8 18-18v-39c18-14 32-38 32-69 0-51-30-88-84-88z" fill="url(#hud)"/>
    <path d="M112 20l9 30-11 14 13 24-6 10" stroke="#2a2420" stroke-width="3" fill="none" stroke-linecap="round"/>
    <ellipse cx="66" cy="106" rx="25" ry="29" fill="#050308"/><ellipse cx="134" cy="106" rx="25" ry="29" fill="#050308"/>
    <circle class="pupill" cx="66" cy="110" r="8" fill="#ff2a2a" filter="url(#glød)"/><circle class="pupill" cx="134" cy="110" r="8" fill="#ff2a2a" filter="url(#glød)"/>
    <path d="M100 130l-13 28h26z" fill="#050308"/>
    <path d="M56 178h88v18c0 7-5 12-12 12H68c-7 0-12-5-12-12z" fill="#050308"/>
    <g fill="#efe8d8"><rect x="63" y="178" width="9" height="13" rx="2"/><rect x="76" y="178" width="9" height="19" rx="2"/><rect x="89" y="178" width="9" height="15" rx="2"/><rect x="102" y="178" width="9" height="20" rx="2"/><rect x="115" y="178" width="9" height="14" rx="2"/><rect x="128" y="178" width="9" height="18" rx="2"/></g>
  </svg>
</div>
<div class="brytere" role="group" aria-label="Lyd og skremsler">
  <button type="button" id="lydbryter" aria-pressed="true" title="Slå lyden av eller på"><span class="ikon">🔊</span><span class="tekst">Lyd</span></button>
  <button type="button" id="skrekkbryter" aria-pressed="true" title="Slå skremslene av eller på"><span class="ikon">💀</span><span class="tekst">Skremsler</span></button>
</div>
<svg class="flaggermus" style="--d:26s;--t:12%;--s:1" viewBox="0 0 64 28" aria-hidden="true"><use href="#bat"/></svg>
<svg class="flaggermus" style="--d:41s;--t:28%;--s:.6;animation-delay:-17s" viewBox="0 0 64 28" aria-hidden="true"><use href="#bat"/></svg>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="bat" viewBox="0 0 64 28"><path fill="currentColor" d="M32 8c2 0 3 2 3.5 4 3-4 8-6 14-5-3 2-4 4-3.5 6 3 0 6 1 8.5 3-4-1-7 0-9 2-1-2-3-3-5-3-1 2-3 4-4.5 8-1-3-2-5-3-6-1 1-2 3-3 6-1.5-4-3.5-6-4.5-8-2 0-4 1-5 3-2-2-5-3-9-2 2.5-2 5.5-3 8.5-3 .5-2-.5-4-3.5-6 6-1 11 1 14 5 .5-2 1.5-4 3.5-4z"/></symbol>
</svg>

<header class="topp">
  <svg class="måne" viewBox="0 0 100 100" aria-hidden="true">
    <defs><radialGradient id="mg" cx="40%" cy="38%"><stop offset="0" stop-color="#fffbe8"/><stop offset="1" stop-color="#d9cfa0"/></radialGradient></defs>
    <circle cx="50" cy="50" r="38" fill="url(#mg)"/>
    <circle cx="38" cy="40" r="7" fill="#000" opacity=".09"/><circle cx="60" cy="58" r="10" fill="#000" opacity=".08"/><circle cx="55" cy="33" r="4" fill="#000" opacity=".07"/>
  </svg>
  <h1>Seansen</h1>
  <p class="under">Påkall riktig konsulent fra mørket</p>
  <nav class="faner" role="tablist">
    <button role="tab" id="fane-spor" aria-selected="true" aria-controls="panel-spor">Påkallelse</button>
    <button role="tab" id="fane-kap" aria-selected="false" aria-controls="panel-kap">Hvem våkner når?</button>
  </nav>
</header>

<main>
  <section id="panel-spor" role="tabpanel" aria-labelledby="fane-spor">
    <div id="trad" aria-live="polite"></div>

    <form id="skjema" class="skjema">
      <label for="behov" class="skjult">Beskriv behovet</label>
      <textarea id="behov" rows="2" placeholder="Hvem trenger du? F.eks. «Vi trenger noen som kan Terraform og Azure, ledig fra november, helst C-grad eller over»" autofocus></textarea>
      <button type="submit" id="send"><span>Påkall</span></button>
    </form>
    <div class="forslag" id="forslag"></div>
    <p class="ny"><button type="button" id="ny" hidden>↺ Start en ny séance</button></p>
  </section>

  <section id="panel-kap" role="tabpanel" aria-labelledby="fane-kap" hidden>
    <div class="kap-topp">
      <h2>Hele flokken, sortert etter oppvåkning</h2>
      <label class="skjult" for="filter">Filtrer</label>
      <input id="filter" type="search" placeholder="Filtrer på navn, rolle, sted eller ferdighet …">
    </div>
    <div id="kap-liste"></div>
  </section>
</main>

<footer>Alle sjeler i denne séancen er syntetiske. Ingen faktiske konsulenter ble forstyrret.</footer>
<script src="app.js" type="module"></script>
</body>
</html>
