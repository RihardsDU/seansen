<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seansen – påkall riktig konsulent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="embers" aria-hidden="true"></canvas>
<div class="tåke" aria-hidden="true"><i></i><i></i><i></i></div>
<div id="øyne" aria-hidden="true"></div>
<div id="lyn" class="lyn" aria-hidden="true"></div>
<div id="skrekk" class="skrekk" hidden aria-hidden="true">
  <svg class="ansikt" viewBox="0 0 200 240">
    <defs>
      <radialGradient id="hud" cx="50%" cy="38%"><stop offset="0" stop-color="#efe8d8"/><stop offset=".7" stop-color="#a39a8b"/><stop offset="1" stop-color="#4a4139"/></radialGradient>
      <filter id="glød"><feGaussianBlur stdDeviation="2.5"/></filter>
    </defs>
    <path d="M100 8c-54 0-84 37-84 88 0 31 14 55 32 69v39c0 10 8 18 18 18h68c10 0 18-8 18-18v-39c18-14 32-38 32-69 0-51-30-88-84-88z" fill="url(#hud)"/>
    <path d="M112 20l9 30-11 14 13 24-6 10" stroke="#2a2420" stroke-width="3" fill="none" stroke-linecap="round"/>
    <ellipse cx="66" cy="106" rx="25" ry="29" fill="#050308"/><ellipse cx="134" cy="106" rx="25" ry="29" fill="#050308"/>
    <circle class="pupill" cx="66" cy="110" r="8" fill="#ff2a2a" filter="url(#glød)"/><circle class="pupill" cx="134" cy="110" r="8" fill="#ff2a2a" filter="url(#glød)"/>
    <path d="M100 130l-13 28h26z" fill="#050308"/>
    <path d="M56 178h88v18c0 7-5 12-12 12H68c-7 0-12-5-12-12z" fill="#050308"/>
    <g fill="#efe8d8"><rect x="63" y="178" width="9" height="13" rx="2"/><rect x="76" y="178" width="9" height="19" rx="2"/><rect x="89" y="178" width="9" height="15" rx="2"/><rect x="102" y="178" width="9" height="20" rx="2"/><rect x="115" y="178" width="9" height="14" rx="2"/><rect x="128" y="178" width="9" height="18" rx="2"/></g>
  </svg>
  <svg class="skjelett" viewBox="-50 -50 320 380">
    <g fill="#efe8d8" stroke="#2a2420" stroke-width="2" stroke-linejoin="round">
      <path d="M110 10c-36 0-58 26-58 60 0 22 10 38 24 48v24c0 8 6 14 14 14h40c8 0 14-6 14-14v-24c14-10 24-26 24-48 0-34-22-60-58-60z"/>
      <ellipse cx="88" cy="74" rx="15" ry="18" fill="#050308" stroke="none"/><ellipse cx="132" cy="74" rx="15" ry="18" fill="#050308" stroke="none"/>
      <circle class="pupill" cx="88" cy="77" r="5" fill="#ff2a2a" stroke="none" filter="url(#glød)"/><circle class="pupill" cx="132" cy="77" r="5" fill="#ff2a2a" stroke="none" filter="url(#glød)"/>
      <path d="M110 90l-8 18h16z" fill="#050308" stroke="none"/>
      <path d="M86 126h48v12c0 5-3 8-8 8H94c-5 0-8-3-8-8z" fill="#050308" stroke="none"/>
      <g fill="#efe8d8" stroke="none"><rect x="90" y="126" width="6" height="10" rx="1.5"/><rect x="99" y="126" width="6" height="13" rx="1.5"/><rect x="108" y="126" width="6" height="11" rx="1.5"/><rect x="117" y="126" width="6" height="14" rx="1.5"/><rect x="126" y="126" width="6" height="10" rx="1.5"/></g>
      <rect x="104" y="154" width="12" height="150" rx="4"/>
      <path d="M58 172h104" stroke="#efe8d8" stroke-width="9" stroke-linecap="round"/>
      <path d="M66 192q44 28 88 0M70 214q40 26 80 0M76 236q34 22 68 0M82 258q28 18 56 0" fill="none" stroke="#efe8d8" stroke-width="8" stroke-linecap="round"/>
      <path d="M66 192q44 28 88 0M70 214q40 26 80 0M76 236q34 22 68 0M82 258q28 18 56 0" fill="none" stroke="#2a2420" stroke-width="1.5" stroke-linecap="round"/>
      <g class="arm" stroke="#efe8d8" stroke-linecap="round" fill="none">
        <path d="M60 174L26 128M26 128L10 70" stroke-width="9"/>
        <path d="M160 174L194 128M194 128L210 70" stroke-width="9"/>
      </g>
      <use href="#haand" x="-18" y="-15" width="56" height="86" transform="rotate(-34 10 70)"/>
      <use href="#haand" x="182" y="-15" width="56" height="86" transform="rotate(34 210 70)"/>
    </g>
  </svg>
</div>
<div id="skrekk-lag" aria-hidden="true"></div>
<div class="brytere" role="group" aria-label="Lyd og skremsler">
  <button type="button" id="lydbryter" aria-pressed="true" title="Slå lyden av eller på"><span class="ikon">🔊</span><span class="tekst">Lyd</span></button>
  <button type="button" id="skrekkbryter" aria-pressed="true" title="Slå skremslene av eller på"><span class="ikon">💀</span><span class="tekst">Skremsler</span></button>
</div>
<svg class="flaggermus" style="--d:26s;--t:12%;--s:1" viewBox="0 0 64 28" aria-hidden="true"><use href="#bat"/></svg>
<svg class="flaggermus" style="--d:41s;--t:28%;--s:.6;animation-delay:-17s" viewBox="0 0 64 28" aria-hidden="true"><use href="#bat"/></svg>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="bat" viewBox="0 0 64 28"><path fill="currentColor" d="M32 8c2 0 3 2 3.5 4 3-4 8-6 14-5-3 2-4 4-3.5 6 3 0 6 1 8.5 3-4-1-7 0-9 2-1-2-3-3-5-3-1 2-3 4-4.5 8-1-3-2-5-3-6-1 1-2 3-3 6-1.5-4-3.5-6-4.5-8-2 0-4 1-5 3-2-2-5-3-9-2 2.5-2 5.5-3 8.5-3 .5-2-.5-4-3.5-6 6-1 11 1 14 5 .5-2 1.5-4 3.5-4z"/></symbol>
  <!-- Skjeletthånd: underarm, håndflate og fem fingre i tre ledd. Fingrene krøller seg via .finger i CSS. -->
  <symbol id="haand" viewBox="0 -12 120 182" overflow="visible">
    <g fill="#e6dfd0" stroke="#3a3028" stroke-width="2" stroke-linejoin="round">
      <rect x="46" y="118" width="28" height="64" rx="10"/>
      <path d="M32 78c0-10 8-18 18-18h22c10 0 18 8 18 18v30c0 14-10 22-29 22s-29-8-29-22z"/>
      <g transform="rotate(-18 40 64)"><g class="finger"><rect x="34" y="42" width="12" height="24" rx="5"/><rect x="34" y="22" width="12" height="20" rx="5"/><rect x="35" y="6" width="10" height="16" rx="5"/></g></g>
      <g transform="rotate(-6 52 60)"><g class="finger"><rect x="46" y="36" width="12" height="26" rx="5"/><rect x="46" y="14" width="12" height="22" rx="5"/><rect x="47" y="-4" width="10" height="18" rx="5"/></g></g>
      <g transform="rotate(5 64 60)"><g class="finger"><rect x="58" y="34" width="12" height="28" rx="5"/><rect x="58" y="10" width="12" height="24" rx="5"/><rect x="59" y="-8" width="10" height="18" rx="5"/></g></g>
      <g transform="rotate(16 76 62)"><g class="finger"><rect x="70" y="40" width="12" height="24" rx="5"/><rect x="70" y="20" width="12" height="20" rx="5"/><rect x="71" y="4" width="10" height="16" rx="5"/></g></g>
      <g transform="rotate(52 36 96)"><g class="finger"><rect x="30" y="76" width="12" height="22" rx="5"/><rect x="30" y="58" width="12" height="18" rx="5"/></g></g>
    </g>
  </symbol>
  <symbol id="edderkopp" viewBox="-32 -32 64 64" overflow="visible">
    <path d="M-6-6l-12-10-8 2M-7-2l-16-4-6 6M-7 3l-16 4-4 8M-5 7l-12 12-1 8M6-6l12-10 8 2M7-2l16-4 6 6M7 3l16 4 4 8M5 7l12 12 1 8" fill="none" stroke="#1b1620" stroke-width="2.4" stroke-linecap="round"/>
    <ellipse cx="0" cy="4" rx="9" ry="12" fill="#1b1620"/><circle cx="0" cy="-8" r="6" fill="#241c2a"/>
    <circle cx="-2.4" cy="-9" r="1.4" fill="#ff2a2a"/><circle cx="2.4" cy="-9" r="1.4" fill="#ff2a2a"/>
  </symbol>
  <symbol id="spoekelse" viewBox="0 0 80 100">
    <path d="M40 4C20 4 8 20 8 42v50l8-7 8 7 8-7 8 7 8-7 8 7 8-7 8 7V42C72 20 60 4 40 4z" fill="#dfe6f2"/>
    <ellipse cx="29" cy="40" rx="5" ry="8" fill="#0a0810"/><ellipse cx="51" cy="40" rx="5" ry="8" fill="#0a0810"/><ellipse cx="40" cy="60" rx="6" ry="9" fill="#0a0810"/>
  </symbol>
</svg>

<header class="topp">
  <svg class="måne" viewBox="0 0 100 100" aria-hidden="true">
    <defs><radialGradient id="mg" cx="40%" cy="38%"><stop offset="0" stop-color="#fffbe8"/><stop offset="1" stop-color="#d9cfa0"/></radialGradient></defs>
    <circle cx="50" cy="50" r="38" fill="url(#mg)"/>
    <circle cx="38" cy="40" r="7" fill="#000" opacity=".09"/><circle cx="60" cy="58" r="10" fill="#000" opacity=".08"/><circle cx="55" cy="33" r="4" fill="#000" opacity=".07"/>
  </svg>
  <h1>Seansen</h1>
  <p class="under">Påkall riktig konsulent fra mørket</p>
  <nav class="faner" role="tablist">
    <button role="tab" id="fane-spor" aria-selected="true" aria-controls="panel-spor">Påkallelse</button>
    <button role="tab" id="fane-kap" aria-selected="false" aria-controls="panel-kap">Hvem våkner når?</button>
    <button role="tab" id="fane-reg" aria-selected="false" aria-controls="panel-reg">Sjeleregisteret</button>
  </nav>
</header>

<main>
  <section id="panel-spor" role="tabpanel" aria-labelledby="fane-spor">
    <div id="trad" aria-live="polite"></div>

    <form id="skjema" class="skjema">
      <label for="behov" class="skjult">Beskriv behovet</label>
      <textarea id="behov" rows="2" placeholder="Hvem trenger du? F.eks. «Vi trenger noen som kan Terraform og Azure, ledig fra november, helst C-grad eller over»" autofocus></textarea>
      <button type="submit" id="send"><span>Påkall</span></button>
    </form>
    <div class="forslag" id="forslag"></div>
    <p class="ny"><button type="button" id="ny" hidden>↺ Start en ny séance</button></p>
  </section>

  <section id="panel-kap" role="tabpanel" aria-labelledby="fane-kap" hidden>
    <div class="kap-topp">
      <h2>Hele flokken, sortert etter oppvåkning</h2>
      <label class="skjult" for="filter">Filtrer</label>
      <input id="filter" type="search" placeholder="Filtrer på navn, rolle, sted eller ferdighet …">
    </div>
    <div id="kap-liste"></div>
  </section>

  <section id="panel-reg" role="tabpanel" aria-labelledby="fane-reg" hidden>
    <div class="kap-topp">
      <h2>Alle sjeler i registeret</h2>
      <label class="skjult" for="reg-sok">Søk</label>
      <input id="reg-sok" type="search" placeholder="Søk på navn, rolle, ferdighet, sertifisering, kunde …">
    </div>
    <form id="reg-filtre" class="filtre" aria-label="Filtre">
      <fieldset><legend>Grad</legend><div id="reg-grad" class="chips"></div></fieldset>
      <fieldset><legend>Sted</legend><div id="reg-sted" class="chips"></div></fieldset>
      <fieldset><legend>Avdeling</legend><div id="reg-avd" class="chips"></div></fieldset>
      <fieldset class="rad">
        <legend>Tilgjengelighet</legend>
        <label>Ledig senest <input id="reg-dato" type="date"></label>
        <label>Minst <select id="reg-pst"><option value="0">0 %</option><option value="50">50 %</option><option value="80">80 %</option><option value="100">100 %</option></select> ledig</label>
        <label><input id="reg-cv" type="checkbox"> Har CV</label>
        <button type="button" id="reg-nullstill">Nullstill</button>
      </fieldset>
    </form>
    <p class="reg-status" id="reg-status" aria-live="polite"></p>
    <div class="reg-boks"><table id="reg-tabell" class="reg"><thead></thead><tbody></tbody></table></div>
  </section>
</main>

<footer>Alle sjeler i denne séancen er syntetiske. Ingen faktiske konsulenter ble forstyrret.</footer>
<script src="app.js" type="module"></script>
</body>
</html>
